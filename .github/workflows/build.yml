name: Build site

# Trigger the workflow every time you push
on: [push]

jobs:
  build:
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - run: npm ci
      - run: npm run build
